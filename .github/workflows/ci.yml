name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.11'
      # Map CI secrets to env vars used by the app (set these in repository Secrets)
      REAL_DATAVERSE_INTEGRATION: ${{ secrets.REAL_DATAVERSE_INTEGRATION }}
      DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pre-commit hooks (format/lint/type)
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Run tests
        run: |
          pytest -q

      - name: Run integration tests (real Dataverse)
        if: env.REAL_DATAVERSE_INTEGRATION == 'true'
        run: |
          pytest -q rebuild/tests/integration
