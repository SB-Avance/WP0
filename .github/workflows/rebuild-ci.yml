name: Rebuild CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r rebuild/requirements.txt
          pip install pytest mypy types-requests
      - name: Run lint
        run: |
          echo "No linters configured yet"
      - name: Run tests
        env:
          DATAVERSE_URL: "http://example"
          TENANT_ID: "local"
          CLIENT_ID: "local"
          CLIENT_SECRET: "local"
          PHONE_NUMBER_ID: "local"
          ACCESS_TOKEN: "local"
          VERIFY_TOKEN: "local"
        run: |
          python -m pytest -q rebuild/tests
      - name: Run mypy
        run: |
          python -m mypy --config-file=rebuild/mypy.ini
