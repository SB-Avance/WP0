<!-- Simple SVG diagram for backend relationships -->
<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="30" width="180" height="40" fill="#e0e0e0" stroke="#333"/>
  <text x="40" y="55" font-size="16">backend/back.py</text>
  <rect x="250" y="30" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="55" font-size="16">backend/goot.py</text>
  <rect x="250" y="90" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="115" font-size="16">backend/api/auth.py</text>
  <rect x="250" y="150" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="175" font-size="16">backend/api/users.py</text>
  <rect x="250" y="210" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="235" font-size="16">backend/api/messages.py</text>
  <rect x="250" y="270" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="295" font-size="16">backend/api/conversations.py</text>
  <rect x="250" y="330" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="355" font-size="16">backend/api/webhook.py</text>
  <rect x="250" y="390" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="415" font-size="16">backend/api/reportes.py</text>
  <rect x="250" y="450" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="475" font-size="16">backend/api/settings.py</text>
  <rect x="250" y="510" width="180" height="40" fill="#f8f8ff" stroke="#333"/>
  <text x="260" y="535" font-size="16">backend/api/grupos.py</text>
  <line x1="210" y1="50" x2="250" y2="50" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="250" y2="110" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="250" y2="170" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="250" y2="230" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="250" y2="290" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="250" y2="350" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="250" y2="410" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="250" y2="470" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="250" y2="530" stroke="#333" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#333" />
    </marker>
  </defs>
</svg>
